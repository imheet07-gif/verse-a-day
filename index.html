<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verse a Day</title>
  <meta name="description" content="One poem or song each morning, the story behind it, and a private page to write back.">
  <meta name="theme-color" id="meta-theme" content="#E9F0F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101826" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/mark.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Verse a Day">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">

  <script>
    /* Apply the saved theme before first paint so there is no flash. */
    try {
      var t = localStorage.getItem('vad:theme');
      if (t && /^(light|dark|paper|night)$/.test(t)) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-route="">
  <a class="skip" href="#main">Skip to the piece</a>

  <div class="app" id="app" data-rail="closed">
    <header class="masthead" id="masthead" aria-label="Verse a Day"></header>
    <div class="syncbar" id="syncbar" hidden></div>
    <nav class="weekstrip" id="weekstrip" aria-label="This week"></nav>
    <div class="shell">
      <aside class="rail" id="rail" aria-label="Archive rail"></aside>
      <main id="main" tabindex="-1">
        <p class="boot">Opening today's letter&hellip;</p>
      </main>
    </div>
    <nav class="toolbar" id="toolbar" aria-label="Main"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Verse a Day needs JavaScript to show the day's piece.</p></noscript>
</body>
</html>
